amcl:
  ros__parameters:
    alpha1: 0.5
    alpha2: 0.5
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    initial_pose:
      x: 1.6
      y: 1.26
      yaw: 0.0
      z: 0.0
    introspection_mode: disabled
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 1000
    min_particles: 300
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    random_seed: -1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    scan_topic: scan
    set_initial_pose: true
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.05
    use_sim_time: false
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
behavior_server:
  ros__parameters:
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    backup:
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.2
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    cycle_frequency: 10.0
    drive_on_heading:
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.2
      plugin: nav2_behaviors::DriveOnHeading
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: map
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    local_frame: odom
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    robot_base_frame: base_footprint
    rotational_acc_lim: 3.2
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors::Spin
    transform_tolerance: 0.1
    use_sim_time: false
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    bt_search_directories:
    - /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees
    default_cancel_timeout: 50
    default_nav_to_pose_bt_xml: /home/humanoid/Desktop/veeresh/install/hospital_bringup/share/hospital_bringup/behavior_trees/navigate_to_pose.xml
    default_server_timeout: 300
    error_code_name_prefixes:
    - assisted_teleop
    - backup
    - compute_path
    - dock_robot
    - drive_on_heading
    - follow_object
    - follow_path
    - nav_thru_poses
    - nav_to_pose
    - route
    - spin
    - smoother
    - undock_robot
    - wait
    filter_duration: 0.3
    global_frame: map
    introspection_mode: disabled
    navigate_through_poses:
      enable_groot_monitoring: false
      groot_server_port: 1669
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
      search_window: 2.0
    navigate_to_pose:
      enable_groot_monitoring: false
      groot_server_port: 1667
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
      search_window: 2.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    odom_topic: odom
    robot_base_frame: base_footprint
    use_sim_time: false
    wait_for_service_timeout: 1000
collision_monitor:
  ros__parameters:
    PolygonSlow:
      action_type: slowdown
      enabled: false
      min_points: 3
      points: '[[1.15, 0.35], [1.15, -0.35], [0.80, -0.35], [0.80, 0.35]]'
      polygon_pub_topic: polygon_slowdown
      slowdown_ratio: 0.85
      type: polygon
      visualize: true
    PolygonStop:
      action_type: stop
      enabled: true
      min_points: 5
      points: '[[0.55, 0.16], [0.55, -0.16], [0.40, -0.16], [0.40, 0.16]]'
      polygon_pub_topic: polygon_stop
      type: polygon
      visualize: true
    base_frame_id: base_footprint
    base_shift_correction: true
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    enabled: true
    observation_sources:
    - scan
    odom_frame_id: odom
    polygons:
    - PolygonStop
    scan:
      enabled: true
      max_height: 2.0
      min_height: 0.0
      topic: /scan
      type: scan
    # Brief TF stalls used to force a full stop ("invalid source") and
    # Nav2 then aborted with "Failed to make progress".
    source_timeout: 5.0
    state_topic: collision_monitor_state
    stop_pub_timeout: 1.0
    transform_tolerance: 1.0
    use_sim_time: false
controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false
      approach_velocity_scaling_dist: 0.6
      desired_linear_vel: 0.16
      lookahead_dist: 0.8
      lookahead_time: 1.5
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 1.5
      max_lookahead_dist: 1.0
      max_robot_pose_search_dist: 2.0
      min_approach_linear_velocity: 0.08
      min_lookahead_dist: 0.5
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.10
      rotate_to_heading_angular_vel: 0.45
      rotate_to_heading_min_angle: 0.35
      transform_tolerance: 0.5
      use_collision_detection: false
      use_cost_regulated_linear_velocity_scaling: false
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: false
      use_velocity_scaled_lookahead_dist: true
    PathHandler:
      enforce_path_inversion: false
      enforce_path_rotation: false
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      minimum_rotation_angle: 0.785
      plugin: nav2_controller::FeasiblePathHandler
      prune_distance: 2.0
      reject_unit_path: false
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    costmap_update_timeout: 0.3
    failure_tolerance: 0.3
    general_goal_checker:
      path_length_tolerance: 1.0
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    path_handler_plugins:
    - PathHandler
    progress_checker:
      movement_time_allowance: 120.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
    progress_checker_plugins:
    - progress_checker
    speed_limit_topic: speed_limit
    use_realtime_priority: false
    use_sim_time: false
docking_server:
  ros__parameters:
    base_frame: base_link
    controller:
      costmap_topic: local_costmap/costmap_raw
      dock_collision_threshold: 0.3
      footprint_topic: local_costmap/published_footprint
      k_delta: 2.0
      k_phi: 3.0
      projection_time: 5.0
      simulation_step: 0.1
      transform_tolerance: 0.1
      use_collision_detection: true
      v_linear_max: 0.15
      v_linear_min: 0.15
    controller_frequency: 50.0
    dock_approach_timeout: 30.0
    dock_plugins:
    - simple_charging_dock
    dock_prestaging_tolerance: 0.5
    fixed_frame: odom
    initial_perception_timeout: 5.0
    introspection_mode: disabled
    max_retries: 3
    simple_charging_dock:
      dock_direction: forward
      docking_threshold: 0.05
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_roll: -1.57
      external_detection_rotation_yaw: 0.0
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      filter_coef: 0.1
      plugin: opennav_docking::SimpleChargingDock
      staging_x_offset: -0.7
      use_battery_status: false
      use_external_detection_pose: true
      use_stall_detection: false
    undock_angular_tolerance: 0.1
    undock_linear_tolerance: 0.05
    use_sim_time: false
    wait_charge_timeout: 5.0
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
        plugin: nav2_costmap_2d::InflationLayer
      introspection_mode: disabled
      obstacle_layer:
        enabled: false
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          topic: /scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_footprint
      robot_radius: 0.22
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      update_frequency: 5.0
      use_sim_time: false
keepout_costmap_filter_info_server:
  ros__parameters:
    base: 0.0
    filter_info_topic: keepout_costmap_filter_info
    mask_topic: keepout_filter_mask
    multiplier: 1.0
    type: 0
    use_sim_time: false
keepout_filter_mask_server:
  ros__parameters:
    topic_name: keepout_filter_mask
    use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      global_frame: odom
      height: 3
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
        plugin: nav2_costmap_2d::InflationLayer
      introspection_mode: disabled
      plugins:
      - voxel_layer
      - static_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_footprint
      robot_radius: 0.22
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      update_frequency: 5.0
      use_sim_time: false
      voxel_layer:
        enabled: false
        plugin: nav2_costmap_2d::VoxelLayer
      width: 3
loopback_simulator:
  ros__parameters:
    base_frame_id: base_footprint
    map_frame_id: map
    odom_frame_id: odom
    scan_angle_increment: 0.02617
    scan_angle_max: 3.1415
    scan_angle_min: -3.1415
    scan_frame_id: base_scan
    scan_range_max: 30.0
    scan_range_min: 0.05
    scan_use_inf: true
    update_duration: 0.02
    use_sim_time: false
map_saver:
  ros__parameters:
    free_thresh_default: 0.25
    introspection_mode: disabled
    map_subscribe_transient_local: true
    occupied_thresh_default: 0.65
    save_map_timeout: 5.0
    use_sim_time: false
map_server:
  ros__parameters:
    introspection_mode: disabled
    use_sim_time: false
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 1.0
      use_astar: false
    allow_partial_planning: false
    costmap_update_timeout: 1.0
    expected_planner_frequency: 2.0
    introspection_mode: disabled
    planner_plugins:
    - GridBased
    use_sim_time: false
route_server:
  ros__parameters:
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
    CollisionMonitor:
      max_collision_dist: 3.0
      plugin: nav2_route::CollisionMonitor
    CostmapScorer:
      plugin: nav2_route::CostmapScorer
    DistanceScorer:
      plugin: nav2_route::DistanceScorer
    ReroutingService:
      plugin: nav2_route::ReroutingService
    boundary_radius_to_achieve_node: 1.0
    edge_cost_functions:
    - DistanceScorer
    - CostmapScorer
    operations:
    - AdjustSpeedLimit
    - ReroutingService
    - CollisionMonitor
    radius_to_achieve_node: 2.0
    smooth_corners: true
    use_sim_time: false
smoother_server:
  ros__parameters:
    route_smoother:
      do_refinement: true
      enforce_path_inversion: false
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      refinement_num: 5
      tolerance: 1.0e-10
    simple_smoother:
      do_refinement: true
      enforce_path_inversion: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      refinement_num: 2
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
    - route_smoother
    use_sim_time: false
speed_costmap_filter_info_server:
  ros__parameters:
    base: 100.0
    filter_info_topic: speed_costmap_filter_info
    mask_topic: speed_filter_mask
    multiplier: -1.0
    type: 1
    use_sim_time: false
speed_filter_mask_server:
  ros__parameters:
    topic_name: speed_filter_mask
    use_sim_time: false
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 0.20
    - 0.0
    - 1.5
    max_decel:
    - -0.25
    - 0.0
    - -1.5
    max_velocity:
    - 0.16
    - 0.0
    - 0.25
    min_velocity:
    - -0.06
    - 0.0
    - -0.25
    odom_duration: 0.1
    odom_topic: odom
    scale_velocities: false
    smoothing_frequency: 20.0
    use_sim_time: false
    velocity_timeout: 1.0
waypoint_follower:
  ros__parameters:
    introspection_mode: disabled
    loop_rate: 20
    stop_on_failure: false
    use_sim_time: false
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 200
    waypoint_task_executor_plugin: wait_at_waypoint
