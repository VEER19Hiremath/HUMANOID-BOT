    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: map
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    local_frame: odom
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    robot_base_frame: base_footprint
    rotational_acc_lim: 3.2
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors::Spin
    transform_tolerance: 0.1
    use_sim_time: false
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    bt_search_directories:
    - /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees
    default_cancel_timeout: 50
    default_nav_to_pose_bt_xml: /home/humanoid/Desktop/veeresh/install/hospital_bringup/share/hospital_bringup/behavior_trees/navigate_to_pose.xml
    default_server_timeout: 300
    error_code_name_prefixes:
    - assisted_teleop
    - backup
    - compute_path
    - dock_robot
    - drive_on_heading
    - follow_object
    - follow_path
    - nav_thru_poses
    - nav_to_pose
    - route
    - spin
    - smoother
    - undock_robot
    - wait
    filter_duration: 0.3
    global_frame: map
    introspection_mode: disabled
    navigate_through_poses:
      enable_groot_monitoring: false
      groot_server_port: 1669
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
      search_window: 2.0
    navigate_to_pose:
      enable_groot_monitoring: false
      groot_server_port: 1667
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
      search_window: 2.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    odom_topic: odom
    robot_base_frame: base_footprint
    use_sim_time: false
    wait_for_service_timeout: 1000
collision_monitor:
  ros__parameters:
    # Body is 0.50 x 0.40 m centred on the lidar (front edge x=0.25).
    PolygonSlow:
      action_type: slowdown
      enabled: true
      min_points: 3
      points: '[[1.10, 0.33], [1.10, -0.33], [0.70, -0.33], [0.70, 0.33]]'
      polygon_pub_topic: polygon_slowdown
      slowdown_ratio: 0.7   # 0.5 = 0.03 m/s: too little effort to restart a loaded wheel on the floor
      type: polygon
      visualize: true
    # Stop zone follows the direction of travel: ahead when driving forward,
    # behind when the planner reverses (short legs to turn round near a
    # wall). Each starts just past the body so its own parts never trip it.
    PolygonStop:
      action_type: stop
      enabled: true
      min_points: 3
      polygon_pub_topic: polygon_stop
      type: velocity_polygon
      holonomic: false
      velocity_polygons: [forward, backward]
      forward:
        points: '[[0.70, 0.28], [0.70, -0.28], [0.32, -0.28], [0.32, 0.28]]'
        linear_min: 0.0
        linear_max: 1.0
        theta_min: -2.0
        theta_max: 2.0
      backward:
        points: '[[-0.32, 0.28], [-0.32, -0.28], [-0.65, -0.28], [-0.65, 0.28]]'
        linear_min: -1.0
        linear_max: 0.0
        theta_min: -2.0
        theta_max: 2.0
      visualize: true
    base_frame_id: base_footprint
    # false: use the latest pose for each scan. Time-matched lookups failed
    # (TF 1-2 s late on a loaded Pi) and held the robot stopped as "invalid
    # source"; at 0.06 m/s the shift is under 0.1 m.
    base_shift_correction: false
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    enabled: true
    observation_sources:
    - scan
    odom_frame_id: odom
    polygons:
    - PolygonStop
    - PolygonSlow
    scan:
      enabled: true
      max_height: 2.0
      min_height: 0.0
      topic: /scan
      type: scan
    # Brief TF stalls used to force a full stop ("invalid source") and
    # Nav2 then aborted with "Failed to make progress".
    source_timeout: 5.0
    state_topic: collision_monitor_state
    stop_pub_timeout: 1.0
    transform_tolerance: 1.0
    use_sim_time: false
controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false   # forward-only paths (DUBIN)
      approach_velocity_scaling_dist: 0.6
      desired_linear_vel: 0.15   # real m/s (calibrated 40 mm/pulse)
      lookahead_dist: 0.8
      lookahead_time: 1.5
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 0.8
      max_lookahead_dist: 1.0
      max_robot_pose_search_dist: 2.0
      min_approach_linear_velocity: 0.08   # >= 2 pulses/s per wheel
      min_lookahead_dist: 0.5
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.08
      rotate_to_heading_angular_vel: 0.20
      rotate_to_heading_min_angle: 0.785
      transform_tolerance: 0.5
      use_collision_detection: true   # stop before cutting through a mapped wall
      use_cost_regulated_linear_velocity_scaling: false
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: false
      use_velocity_scaled_lookahead_dist: true
    PathHandler:
      enforce_path_inversion: false   # no reverse cusps with DUBIN
      enforce_path_rotation: false
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.6
      minimum_rotation_angle: 0.785
      plugin: nav2_controller::FeasiblePathHandler
      prune_distance: 2.0
      reject_unit_path: false
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    costmap_update_timeout: 0.3
    # Something briefly in the way must not abort the trip: the controller
    # keeps trying this long before asking the planner for a new route.
    failure_tolerance: 3.0
    general_goal_checker:
      path_length_tolerance: 1.0
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25   # forward-only arcs: at 0.15 a near miss meant another full loop ("circling")
      # Arcs-only base can't turn on the spot to a final heading: any yaw is fine.
      yaw_goal_tolerance: 3.15
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    path_handler_plugins:
    - PathHandler
    progress_checker:
      movement_time_allowance: 120.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
    progress_checker_plugins:
    - progress_checker
    speed_limit_topic: speed_limit
    use_realtime_priority: false
    use_sim_time: false
docking_server:
  ros__parameters:
    base_frame: base_link
    controller:
      costmap_topic: local_costmap/costmap_raw
      dock_collision_threshold: 0.3
      footprint_topic: local_costmap/published_footprint
      k_delta: 2.0
      k_phi: 3.0
      projection_time: 5.0
      simulation_step: 0.1
      transform_tolerance: 0.1
      use_collision_detection: true
      v_linear_max: 0.15
      v_linear_min: 0.15
    controller_frequency: 50.0
    dock_approach_timeout: 30.0
    dock_plugins:
    - simple_charging_dock
    dock_prestaging_tolerance: 0.5
    fixed_frame: odom
    initial_perception_timeout: 5.0
    introspection_mode: disabled
    max_retries: 3
    simple_charging_dock:
      dock_direction: forward
      docking_threshold: 0.05
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_roll: -1.57
      external_detection_rotation_yaw: 0.0
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      filter_coef: 0.1
      plugin: opennav_docking::SimpleChargingDock
      staging_x_offset: -0.7
      use_battery_status: false
      use_external_detection_pose: true
      use_stall_detection: false
    undock_angular_tolerance: 0.1
    undock_linear_tolerance: 0.05
    use_sim_time: false
    wait_charge_timeout: 5.0
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      global_frame: map
      inflation_layer:
        # Keep paths in the middle of the free space, away from walls.
        cost_scaling_factor: 4.0
        inflation_radius: 0.60
        plugin: nav2_costmap_2d::InflationLayer
      introspection_mode: disabled
      # Live obstacles in the plan: the robot detours around people and
      # objects (inflation keeps a safe distance) and replans when they move.
      # inf_is_valid: a beam with no return clears its line, so a person who
      # walked away is forgotten. (Without it, marks in directions with no
      # returns stayed forever and boxed the robot in, 2026-09-30.)
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.35   # inside = the robot's own parts
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          inf_is_valid: true
          topic: /scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_footprint
      # Real body: 2 ft long x 1.5 ft wide (0.61 x 0.46 m), centred on the wheels.
      # robot_radius 0.16 let plans hug walls and the body cross them.
      footprint: '[[0.31, 0.23], [0.31, -0.23], [-0.31, -0.23], [-0.31, 0.23]]'   # 2 ft x 1.5 ft
      footprint_padding: 0.02
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      update_frequency: 5.0
      use_sim_time: false
keepout_costmap_filter_info_server:
  ros__parameters:
    base: 0.0
    filter_info_topic: keepout_costmap_filter_info
    mask_topic: keepout_filter_mask
    multiplier: 1.0
    type: 0
    use_sim_time: false
keepout_filter_mask_server:
  ros__parameters:
    topic_name: keepout_filter_mask
    use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      global_frame: odom
      height: 4
      inflation_layer:
        cost_scaling_factor: 4.0
        inflation_radius: 0.60
        plugin: nav2_costmap_2d::InflationLayer
      introspection_mode: disabled
      plugins:
      - obstacle_layer
      - static_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_footprint
      # Real body: 2 ft long x 1.5 ft wide (0.61 x 0.46 m), centred on the wheels.
      # robot_radius 0.16 let plans hug walls and the body cross them.
      footprint: '[[0.31, 0.23], [0.31, -0.23], [-0.31, -0.23], [-0.31, 0.23]]'   # 2 ft x 1.5 ft
      footprint_padding: 0.02
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      update_frequency: 5.0
      use_sim_time: false
      # Live lidar obstacles for the controller (RPP stops before them).
      # inf_is_valid: a beam with no return clears its line too, so marks
      # don't outlive the people / objects that made them.
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.35
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          inf_is_valid: true
          topic: /scan
      width: 4
loopback_simulator:
  ros__parameters:
    base_frame_id: base_footprint
    map_frame_id: map
    odom_frame_id: odom
    scan_angle_increment: 0.02617
    scan_angle_max: 3.1415
    scan_angle_min: -3.1415
    scan_frame_id: base_scan
    scan_range_max: 30.0
    scan_range_min: 0.05
    scan_use_inf: true
    update_duration: 0.02
    use_sim_time: false
map_saver:
  ros__parameters:
    free_thresh_default: 0.25
    introspection_mode: disabled
    map_subscribe_transient_local: true
    occupied_thresh_default: 0.65
    save_map_timeout: 5.0
    use_sim_time: false
map_server:
  ros__parameters:
    introspection_mode: disabled
    use_sim_time: false
planner_server:
  ros__parameters:
    # Hybrid-A* plans only arcs the base can drive (turn radius >= 0.6 m).
    # DUBIN = forward only. Reverse legs (Reeds-Shepp) changed the wheels'
    # direction dozens of times per trip, and the left driver doesn't always
    # follow a direction change made soon after running: one wheel kept
    # going backwards and the robot spun on the spot (floor 2026-09-30). The
    # 30 x 40 ft area leaves room for 1.2 m turn-around loops.
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerHybrid
      motion_model_for_search: DUBIN
      minimum_turning_radius: 0.50   # base_controller allows ~0.46 m
      reverse_penalty: 6.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      lookup_table_size: 15.0
      cache_obstacle_heuristic: true
      downsample_costmap: false
      downsampling_factor: 1
      downsample_obstacle_heuristic: true
      allow_unknown: false
      tolerance: 0.25
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      smooth_path: true
      debug_visualizations: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2
    allow_partial_planning: false
    costmap_update_timeout: 1.0
    expected_planner_frequency: 2.0
    introspection_mode: disabled
    planner_plugins:
    - GridBased
    use_sim_time: false
route_server:
  ros__parameters:
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
    CollisionMonitor:
      max_collision_dist: 3.0
      plugin: nav2_route::CollisionMonitor
    CostmapScorer:
      plugin: nav2_route::CostmapScorer
    DistanceScorer:
      plugin: nav2_route::DistanceScorer
    ReroutingService:
      plugin: nav2_route::ReroutingService
    boundary_radius_to_achieve_node: 1.0
    edge_cost_functions:
    - DistanceScorer
    - CostmapScorer
    operations:
    - AdjustSpeedLimit
    - ReroutingService
    - CollisionMonitor
    radius_to_achieve_node: 2.0
    smooth_corners: true
    use_sim_time: false
smoother_server:
  ros__parameters:
    route_smoother:
      do_refinement: true
      enforce_path_inversion: false
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      refinement_num: 5
      tolerance: 1.0e-10
    simple_smoother:
      do_refinement: true
      enforce_path_inversion: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      refinement_num: 2
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
    - route_smoother
    use_sim_time: false
speed_costmap_filter_info_server:
  ros__parameters:
    base: 100.0
    filter_info_topic: speed_costmap_filter_info
    mask_topic: speed_filter_mask
    multiplier: -1.0
    type: 1
    use_sim_time: false
speed_filter_mask_server:
  ros__parameters:
    topic_name: speed_filter_mask
    use_sim_time: false
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 0.15
    - 0.0
    - 0.6
    max_decel:
    - -0.20
    - 0.0
    - -0.6
    max_velocity:
    - 0.16
    - 0.0
    - 0.12
    # 0 = navigation never reverses the wheels (see the planner comment).
    min_velocity:
    - 0.0
    - 0.0
    - -0.12
    odom_duration: 0.1
    odom_topic: odom
    scale_velocities: false
    smoothing_frequency: 20.0
    use_sim_time: false
    velocity_timeout: 1.0
waypoint_follower:
  ros__parameters:
    introspection_mode: disabled
    loop_rate: 20
    stop_on_failure: false
    use_sim_time: false
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 200
    waypoint_task_executor_plugin: wait_at_waypoint
